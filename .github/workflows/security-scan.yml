name: Security Scanning Pipeline

# Trigger this workflow every time code is pushed or a Pull Request is made
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  iac-security-scan:
    name: Infrastructure Security Scan (Checkov)
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download/checkout the code from our repository onto the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install and run Checkov, our static security scanner
      - name: Run Checkov Security Scan
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform
          output_format: cli
          soft_fail: false # Hard fail: block the pipeline if a high-severity flaw is found!
